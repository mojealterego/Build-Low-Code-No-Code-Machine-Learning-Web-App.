name: Python quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Building Low code application/requirements.txt"

      - name: Install test/runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "Building Low code application/requirements.txt"
          python -m pip install pytest

      - name: Run smoke tests
        run: python -m pytest -q
